name: Build KDE Connect (Nightly)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    container:
      image: ghcr.io/justsaft/vanilla-ci-building:main

    env:
      DEBIAN_FRONTEND: noninteractive
      KDE_SRC: /opt/kde/src
      KDE_BUILD: /opt/kde/build
      KDE_INSTALL: /opt/kde/usr

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Setup GITHUB_PATH
      - name: Setup GITHUB_PATH
        run: |
          echo "/usr/kdesrc-build" >> $GITHUB_PATH

      # -------------------------
      # Get number of CPU cores
      - name: Get number of CPU cores
        id: cpus
        run: |
          echo "count=$(nproc)" >> $GITHUB_OUTPUT

      # -------------------------
      # Write kdesrc-build config and compute hash
      - name: Write kdesrc-build config and compute hash
        id: config
        run: |
          mkdir -p ~/.config
          cat << "EOF" > ~/.config/kdesrc-buildrc
          global
              source-dir /opt/kde/src
              build-dir /opt/kde/build
              install-dir /opt/kde/usr
              cmake-generator Kate - Ninja
              cmake-options -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF
              branch-group kf6-qt6
              include-dependencies true
              num-cores-low-mem 2
              install-environment-driver true
              install-session-driver false
              stop-on-failure true
              do-not-compile kdoctool
              generate-vscode-project-config false
              directory-layout flat
          end global
          options kdeconnect-kde
              branch release/26.08
          end options
          include ${module-definitions-dir}/kf6-qt6.ksb
          EOF

          CONFIG_HASH=$(sha256sum ~/.config/kdesrc-buildrc | cut -d' ' -f1 | cut -c1-8)
          echo "hash=$CONFIG_HASH" >> $GITHUB_OUTPUT
          sed -i "/num-cores-low-mem/i\        num-cores ${{ steps.cpus.outputs.count }}" ~/.config/kdesrc-buildrc

      # -------------------------
      # Cache KDE sources + build
      - name: Restore KDE cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/kde/src
            /opt/kde/build
          # Keyed by matrix.arch, not runner.os: both runners report "Linux",
          # so keying on runner.os would have the amd64 and arm64 legs share
          # (and clobber) the same cache.
          key: kde-${{ matrix.arch }}-${{ github.ref_name }}-${{ steps.config.outputs.hash }}
          restore-keys: |
            kde-${{ matrix.arch }}-${{ github.ref_name }}-
            kde-${{ matrix.arch }}-

      # -------------------------
      # Build KDE Connect
      - name: Build KDE Connect
        run: |
          set +e
          kdesrc-build --include-dependencies --async --reconfigure kdeconnect
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::kdesrc-build log directory (latest run)"
            find "$KDE_SRC/log/latest" -maxdepth 2 2>/dev/null | sort
            echo "::endgroup::"

            for f in "$KDE_SRC"/log/latest/*/error.log; do
              [ -e "$f" ] || continue
              echo "::group::error.log — $f"
              cat "$f"
              echo "::endgroup::"
            done

            for f in "$KDE_SRC"/log/latest/*/cmake.log; do
              [ -e "$f" ] || continue
              echo "::group::cmake.log — $f"
              cat "$f"
              echo "::endgroup::"
            done

            for f in "$KDE_SRC"/log/latest/*/build-1.log "$KDE_SRC"/log/latest/*/build.log; do
              [ -e "$f" ] || continue
              echo "::group::build log (tail -300) — $f"
              tail -n 300 "$f"
              echo "::endgroup::"
            done
          fi

          exit "$status"

      # -------------------------
      # Guard against a "green but did nothing" build: if kdeconnect-kde's
      # dependency-graph resolution fails (e.g. a bad branch-group/options
      # override), kdesrc-build can exit 0 having silently built nothing.
      # Refuse to package/publish in that case rather than shipping a stale
      # or empty artifact.
      - name: Verify kdeconnect-kde was actually built
        if: success()
        run: |
          if [ ! -d "$KDE_SRC/log/latest/kdeconnect-kde" ]; then
            echo "::error::kdeconnect-kde has no log directory for this run — it was not actually processed (dependency graph may have failed to resolve it). Refusing to publish."
            exit 1
          fi

      # -------------------------
      # Package artifacts
      - name: Create artifact archives
        if: success()
        run: |
          tar -czf kdeconnect-nightly-${{ matrix.arch }}.tar.gz -C /opt/kde/usr .

      # -------------------------
      # Upload artifact
      #
      # Only the tar.gz here on purpose: upload-artifact computes the
      # artifact's root as the least common ancestor of every path in this
      # list, before checking which ones exist. A leftover absolute path
      # like /opt/kdeconnect.txt (which nothing in this workflow creates)
      # drags that ancestor down to "/", so the tar.gz — even though it's
      # the only file that actually exists — gets nested several
      # directories deep inside the artifact instead of sitting at its
      # root. That breaks the release job's flat `dist/*.tar.gz` glob.
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-nightly-${{ matrix.arch }}
          path: kdeconnect-nightly-${{ matrix.arch }}.tar.gz

      # -------------------------
      # Package logs artifact
      - name: Create log archive
        if: always()
        run: |
          tar -czf logs-${{ matrix.arch }}.tar.gz -C "$KDE_SRC/log/latest" .

      # -------------------------
      # Upload log archive
      # Named without the "kdeconnect-nightly" prefix so it's never picked up
      # by the release job's artifact pattern below.
      - name: Upload log archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-build-logs-${{ matrix.arch }}
          path: logs-${{ matrix.arch }}.tar.gz
          if-no-files-found: warn

      # -------------------------
      # Save updated cache
      - name: Save KDE cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            /opt/kde/src
            /opt/kde/build
          key: kde-${{ matrix.arch }}-${{ github.ref_name }}-${{ steps.config.outputs.hash }}

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: kdeconnect-nightly-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="kdeconnect-nightly"
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS
          NOTES="Prebuilt KDE Connect nightly artifacts (amd64, arm64) for Vib, built in vos-ci-building (branch-group kf6-qt6, kdeconnect-kde pinned to release/26.08). Last updated $BUILD_DATE from run ${{ github.run_id }}."
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "KDE Connect (nightly, prebuilt)" \
            --notes "$NOTES" \
            --prerelease \
          || gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "${{ github.repository }}" --clobber
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTES"