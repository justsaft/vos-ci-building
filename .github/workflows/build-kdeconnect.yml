name: Build KDE Connect (Nightly)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/justsaft/vanilla-ci-building:main

    env:
      DEBIAN_FRONTEND: noninteractive
      KDE_SRC: /opt/kde/src
      KDE_BUILD: /opt/kde/build
      KDE_INSTALL: /opt/kde/usr

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Setup GITHUB_PATH
      - name: Setup GITHUB_PATH
        run: |
          echo "/usr/kdesrc-build" >> $GITHUB_PATH

      # -------------------------
      # Get number of CPU cores
      - name: Get number of CPU cores
        id: cpus
        run: |
          echo "count=$(nproc)" >> $GITHUB_OUTPUT

      # -------------------------
      # Write kdesrc-build config and compute hash
      - name: Write kdesrc-build config and compute hash
        id: config
        run: |
          mkdir -p ~/.config
          # Create config without CPU count first for stable hash
          cat << "EOF" > ~/.config/kdesrc-buildrc
          global
              source-dir /opt/kde/src
              build-dir /opt/kde/build
              install-dir /opt/kde/usr
              cmake-generator Kate - Ninja
              cmake-options -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF
              branch-group kf6-qt6
              include-dependencies true
              num-cores-low-mem 2
              install-environment-driver true
              install-session-driver false
              stop-on-failure true
              do-not-compile python
              generate-vscode-project-config false
              directory-layout flat
          end global
          include ${module-definitions-dir}/kf6-qt6.ksb
          EOF

          CONFIG_HASH=$(sha256sum ~/.config/kdesrc-buildrc | cut -d' ' -f1 | cut -c1-8)
          echo "hash=$CONFIG_HASH" >> $GITHUB_OUTPUT
          sed -i "/num-cores-low-mem/i\        num-cores ${{ steps.cpus.outputs.count }}" ~/.config/kdesrc-buildrc

      # -------------------------
      # Cache KDE sources + build
      - name: Restore KDE cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/kde/src
            /opt/kde/build
          key: kde-${{ runner.os }}-${{ github.ref_name }}-${{ steps.config.outputs.hash }}
          restore-keys: |
            kde-${{ runner.os }}-${{ github.ref_name }}-
            kde-${{ runner.os }}-

      # -------------------------
      # Build KDE Connect
      - name: Build KDE Connect
        run: |
          kdesrc-build --include-dependencies --do-not-compile python --async --reconfigure kdeconnect || cat /github/home/kde/src/log/latest/*/error.log
          ldd /opt/kde/usr/kdeconnect-kde > /opt/kdeconnect.txt

      # -------------------------
      # Package artifacts
      - name: Create artifact archives
        if: success()
        run: |
          tar -czf kdeconnect-nightly.tar.gz -C /opt/kde/usr .

      # -------------------------
      # Package logs artifact
      - name: Create log archive
        if: false
        run: |
          tar -czf logs.tar.gz -C /github/home/kde/src/log/latest-by-phase/ .

      # -------------------------
      # Upload log archive
      - name: Upload log archive artifact
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-nightly-build-logs
          path: logs.tar.gz

      # -------------------------
      # Upload artifact
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-nightly
          path: |
            kdeconnect-nightly.tar.gz
            /opt/kdeconnect.txt

      # -------------------------
      # Save updated cache
      - name: Save KDE cache
        if: success()
        uses: actions/cache@v4
        with:
          path: |
            /opt/kde/src
            /opt/kde/build
          key: kde-${{ runner.os }}-${{ github.ref_name }}-${{ steps.config.outputs.hash }}