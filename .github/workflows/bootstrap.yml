name: 'VIB build for bootstrapping image'

on:
  schedule:
    # Mondays 02:00 UTC, a few hours before the build-*.yml workflows so they
    # pick up a refreshed image. Scheduled runs only build when the base image
    # changed (see check_update); manual runs always build.
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  IMAGE_URL: ghcr.io/${{ github.repository_owner }}/vanilla-ci-building
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  check_update:
    runs-on: ubuntu-26.04

    outputs:
      has_updates: ${{ steps.compare.outputs.has_updates }}
      base_image: ${{ steps.read_base_recipe.outputs.base_image }}

    permissions:
      contents: read
      actions: read # find the last successful run and download its digest artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get install -y jq skopeo libfyaml-utils

      - name: Read base image name from recipe
        id: read_base_recipe
        run: |
          # Stage 0 is the one built FROM the registry image; later stages
          # (e.g. initrd) use "base: build", which isn't a pullable image.
          BASE_IMAGE="$(fy-filter -f build-image.yml /stages/0/base)"
          echo "The base image is $BASE_IMAGE"
          [ -n "$BASE_IMAGE" ]
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Get last successful run
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh run list -b "${{ github.ref_name }}" -w "${{ github.workflow }}" -s "success" -L 1 --json databaseId > last_run.json
          echo "LAST_RUN_ID=$(jq -r '.[0].databaseId' last_run.json)" >> "$GITHUB_ENV"

      - name: Download the previous digest
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: digest
          github-token: ${{ github.token }}
          run-id: ${{ env.LAST_RUN_ID }}

      # With no previous digest (first run, expired artifact) last_digest.txt is
      # empty, so the comparison reports an update and the image gets built.
      - name: Check if the base image was updated
        id: compare
        run: |
          touch digest.txt
          mv digest.txt last_digest.txt
          skopeo inspect --raw "docker://$BASE_IMAGE" | sha256sum > digest.txt
          echo "Old digest: $(cat last_digest.txt)"
          echo "New digest: $(cat digest.txt)"
          if [ "${{ github.event_name }}" != "schedule" ] || ! cmp -s digest.txt last_digest.txt; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No update to the base image since the last successful build."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload current digest
        uses: actions/upload-artifact@v6
        with:
          name: digest
          path: digest.txt

  # Without a base image update there is nothing to build: this job is skipped,
  # and so are build and merge, which depend on it.
  verify_base_image:
    if: needs.check_update.outputs.has_updates == 'true'
    runs-on: ubuntu-26.04
    needs:
      - check_update

    steps:
    - name: Verify Base Image Integrity
      run: gh attestation verify oci://${{ needs.check_update.outputs.base_image }} --owner Vanilla-OS
      env:
        GH_TOKEN: ${{ github.token }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs:
      - verify_base_image
    permissions:
      packages: write # Allow pushing images to GHCR
      attestations: write # To create and write attestations
      id-token: write # Additional permissions for the persistence of the attestations

    steps:
    - uses: actions/checkout@v6

    - name: Free runner disk space
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker system prune -af || true
        df -h

    - uses: vanilla-os/vib-gh-action@main
      with:
        recipe: 'build-image.yml'
        plugins: 'Vanilla-OS/vib-fsguard:v1.6.1'
        output: 'Containerfile'

    - uses: actions/upload-artifact@v7
      with:
        name: Containerfile-${{ matrix.arch }}
        path: Containerfile
        overwrite: true

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_URL }}
        tags: |
          type=raw,value=main

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Package Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # NOTE: this pushes the per-arch image BY DIGEST ONLY (no tag). The
    # actual tag ("main") is only created once, in the merge job below,
    # once every arch's digest has been collected. This is what prevents
    # the amd64 and arm64 legs from racing to overwrite the same tag.
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Containerfile
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=min
        platforms: linux/${{ matrix.arch }}
        provenance: false
        outputs: type=image,name=${{ env.IMAGE_URL }},push-by-digest=true,name-canonical=true,push=true

    - name: Attest pushed image
      uses: actions/attest-build-provenance@v3
      id: attest
      with:
        subject-name: ${{ env.IMAGE_URL }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: false

    - name: Export digest
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v6
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-26.04
    needs:
      - build
    permissions:
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_URL }}
          tags: |
            type=raw,value=main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This is the step that actually creates the multi-arch manifest list
      # under the real tag ("main"), pointing at both per-arch digests.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_URL }}@sha256:%s ' *)

      - name: Inspect merged image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_URL }}:main
