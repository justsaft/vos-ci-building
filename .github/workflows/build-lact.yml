name: 'Build LACT (prebuilt artifacts for Vib)'

on:
  schedule:
    # Fires every Monday; the gate job below lets only every other one through.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      lact_version:
        description: 'LACT git tag to build (e.g. v0.10.1). Empty = the default pinned in env below.'
        required: false

env:
  # Scheduled runs have no inputs, so this default is also what they build.
  # Bump it here to move the biweekly builds to a newer LACT.
  LACT_VERSION: ${{ github.event.inputs.lact_version || 'v0.10.1' }}

jobs:
  # GitHub cron can't express "every two weeks", so the schedule fires weekly
  # and this job skips every other scheduled run. The parity of whole weeks
  # since the Unix epoch is stateless and stable across year boundaries (ISO
  # week numbers are not: 2026 has 53 weeks, so W53 -> W01 would run twice in
  # a row). Manual runs always go through.
  gate:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.parity.outputs.run }}
    steps:
      - id: parity
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ $(( $(date -u +%s) / 604800 % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off week - skipping this scheduled run."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/justsaft/vanilla-ci-building:main

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libgtk-4-dev libadwaita-1-dev libdrm-dev libudev-dev \
            libdisplay-info-dev clang libclang-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Clone LACT
        run: git clone --branch "$LACT_VERSION" --depth 1 https://github.com/ilya-zlobintsev/LACT /tmp/lact-src

      - name: Build and stage install
        working-directory: /tmp/lact-src
        run: |
          cargo build --release -p lact
          make install DESTDIR=/tmp/lact-stage PREFIX=/usr

      - name: Package artifact
        run: |
          cd /tmp/lact-stage
          tar -czf /tmp/lact-${{ env.LACT_VERSION }}-${{ matrix.arch }}.tar.gz .
          sha256sum /tmp/lact-${{ env.LACT_VERSION }}-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: lact-${{ matrix.arch }}
          path: /tmp/lact-${{ env.LACT_VERSION }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: lact-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One release per ISO week. Re-running within the same week finds the
          # existing release and replaces its assets instead of failing.
          WEEK="$(date -u +%G-W%V)"
          TAG="lact-$LACT_VERSION-$WEEK"
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "LACT $LACT_VERSION (prebuilt, $WEEK)" \
            --notes "Prebuilt LACT $LACT_VERSION artifacts for Vib, built in vos-ci-building in ISO week $WEEK." \
          || gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "${{ github.repository }}" --clobber