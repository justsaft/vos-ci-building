name: libei-from-source
type: shell

# Debian ships libei 1.5.0 even in sid, but kdeconnect-kde master's mousepad
# plugin needs >= 1.6 (its release/26.08 branch accepts any version). Nothing
# in Debian packages 1.6 yet, so build it here.
# Build deps (meson, ninja-build, pkg-config, git, python3-attr, python3-jinja2,
# libsystemd-dev, libxml2-dev) come from kdeconnect-deps.yml, which must run first.
#
# Vib pastes each `commands` entry verbatim after a Containerfile `RUN`, so an
# entry must be ONE line: a multi-line script is parsed as further Containerfile
# instructions. The folded scalar (>-) joins the lines below into a single line.
commands:
  - >-
    LIBEI_VERSION=1.6.0
    && TAG="$(git ls-remote --tags --refs https://gitlab.freedesktop.org/libinput/libei.git
    | sed 's|.*refs/tags/||' | grep -x -F -e "v$LIBEI_VERSION" -e "$LIBEI_VERSION" | head -1)"
    && { [ -n "$TAG" ] || { echo "ERROR: no libei git tag for $LIBEI_VERSION - see https://gitlab.freedesktop.org/libinput/libei/-/tags" >&2; exit 1; }; }
    && git clone --branch "$TAG" --depth 1 https://gitlab.freedesktop.org/libinput/libei.git /tmp/libei-src
    && meson setup /tmp/libei-build /tmp/libei-src --prefix=/usr --buildtype=release -Dtests=disabled -Ddocumentation='[]' -Dliboeffis=disabled
    && ninja -C /tmp/libei-build install
    && ldconfig
    && rm -rf /tmp/libei-src /tmp/libei-build
    && pkg-config --atleast-version="$LIBEI_VERSION" libei-1.0
