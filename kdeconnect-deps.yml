name: kdesrc-build-install
type: shell
commands:
  - apt-get build-dep -y wayland kdeconnect kdoctools
  #- ln -sf /usr/bin/qmake6 /usr/bin/qmake
  - git clone --depth=1 https://invent.kde.org/sdk/kdesrc-build.git /usr/kdesrc-build
  - /usr/kdesrc-build/kdesrc-build --initial-setup

modules:
- name: kdeconnect-deps
  type: apt
  sources:
    - packages:
      - qt6-base-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-declarative-dev
      - libqt6svg6
      - libkf6config-dev
      - libkf6coreaddons-dev
      - libkf6i18n-dev
      - libkf6kio-dev
      - libkf6notifications-dev
      - libkf6dbusaddons-dev
      - libkf6service-dev
      - libkf6windowsystem-dev
      - libpulse-dev
      - libsasl2-dev
      - libssl-dev
      - libglib2.0-dev
      - dbus
      - ca-certificates
      - mdbook
      - appstream
      - quilt
      - libjson-perl
      - libjson-xs-perl
      - debhelper
      - libkf6modemmanagerqt-dev
      - libkf6statusnotifieritem-dev
      - qt6-connectivity-dev
      - kirigami-addons-dev
      - libkf6package-dev
      - libkirigami-dev
      - xvfb
      - libkf6crash-dev
      - libkf6people-dev
      - pkg-kde-tools
      - libkf6iconthemes-dev
      - libkf6pulseaudioqt-dev
      - plasma-desktoptheme
      - libkf6itemmodels-dev
      - libkf6qqc2desktopstyle-dev
      - qml6-module-org-kde-kquickcontrolsaddons
      - libexpat1-dev
      - expat
      - libexpat1
      - libgraphviz-dev
      - graphviz
      - xsltproc
      # - libxmltok1t64
      # - libxmltok1-dev
      - xmlto
      - libxmltooling-dev
      - libxmltooling11
      - libshiboken6-dev
      - libpyside6-dev
      - libkf5archive-dev
      - libkf5i18n-dev
      - libpcre2-dev
      - wayland-scanner++
      - libwayland-dev

- name: python-deps
  type: apt
  sources:
    - packages:
      - python3
      - python3-dev
      - python3-sphinx
      - python3-sphinxcontrib.qthelp
      - python3-pyatspi
      - python3-lxml
      - python3-flask
      - python3-setuptools
      - python3-build
      - python3-twisted
      - python3-cairo
      - python3-pip

- name: build-essential
  type: apt
  sources:
    - packages:
      - git
      - calc
      - qmake6
      - cmake
      - meson
      - ninja-build
      - build-essential
      - extra-cmake-modules
      - gcc
      - g++
      - clang
      - libclang-dev
      - llvm-dev