name: kdesrc-build-install
type: shell
commands:
  #- apt-get build-dep -y wayland kdeconnect
  - ln -s /usr/bin/qmake6 /usr/bin/qmake
  - git clone --depth=1 https://invent.kde.org/sdk/kdesrc-build.git /usr/kdesrc-build
  - /usr/kdesrc-build/kdesrc-build --initial-setup

modules:
- name: kdeconnect-deps
  type: apt
  sources:
    - packages:
      - git
      - calc
      - qmake6
      - cmake
      - ninja-build
      - build-essential
      - extra-cmake-modules
      - qt6-base-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-declarative-dev
      - libqt6svg6
      - libkf6config-dev
      - libkf6coreaddons-dev
      - libkf6i18n-dev
      - libkf6kio-dev
      - libkf6notifications-dev
      - libkf6dbusaddons-dev
      - libkf6service-dev
      - libkf6windowsystem-dev
      - libpulse-dev
      - libsasl2-dev
      - libssl-dev
      - libglib2.0-dev
      - dbus
      - ca-certificates
      - mdbook
      - appstream
      - quilt
      - libjson-perl
      - libjson-xs-perl
      - debhelper
      - libkf6modemmanagerqt-dev
      - libkf6statusnotifieritem-dev
      - qt6-connectivity-dev
      - kirigami-addons-dev
      - libkf6package-dev
      - libkirigami-dev
      - xvfb
      - libkf6crash-dev
      - libkf6people-dev
      - pkg-kde-tools
      - libkf6iconthemes-dev
      - libkf6pulseaudioqt-dev
      - plasma-desktoptheme
      - libkf6itemmodels-dev
      - libkf6qqc2desktopstyle-dev
      - qml6-module-org-kde-kquickcontrolsaddons
      - libexpat1-dev
      - expat
      - libexpat1
      - libgraphviz-dev
      - graphviz
      - xsltproc
      - libxmltok1t64
      - libxmltok1-dev
      - xmlto